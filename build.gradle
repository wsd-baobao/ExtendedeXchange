plugins {
	id "dev.architectury.loom" version "0.12.0-SNAPSHOT"
	id "maven-publish"
	id "com.matthewprenger.cursegradle" version "1.4.0"
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

def ENV = System.getenv()

// All jar files from this folder will be added automatically as runtime mod dependencies
String extraModsDir = "extra-mods-${project.minecraft_version}"

loom {
	silentMojangMappingsLicense()

	forge {
		mixinConfigs = [
//				"examplemod.mixins.json"
		]

		dataGen {
			mod project.mod_id
		}
	}

	launches {
		data {
			arg "--existing", file("src/main/resources").absolutePath
		}
	}
}

repositories {
	flatDir {
		name "extra-mods"
		dir file(extraModsDir)
	}
	maven {
		url "https://cursemaven.com"
	}
	maven {
		url 'https://dvs1.progwml6.com/files/maven'
	}
	maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

//	mappings loom.officialMojangMappings()
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
	}
	forge "net.minecraftforge:forge:${project.forge_version}"

	modImplementation "curse.maven:projecte-226410:${project.projecte_file}"

	modCompileOnly "curse.maven:jei-238222:${jei_version}-api"
	modRuntimeOnly "curse.maven:jei-238222:${jei_version}"

//	modCompileOnly "mezz.jei:jei-${minecraft_version}:${jei_version}:api"
//	modRuntimeOnly "mezz.jei:jei-${minecraft_version}:${jei_version}"

	// Locally sourced extra mods for runtime (i.e. testing) - thanks AE2 for this idea
	for (extraModJar in fileTree(dir: extraModsDir, include: '*.jar')) {
		def basename = extraModJar.name.substring(0, extraModJar.name.length() - ".jar".length())
		def versionSep = basename.lastIndexOf('-')
		assert versionSep != -1
		def artifactId = basename.substring(0, versionSep)
		def version = basename.substring(versionSep + 1)
		modRuntimeOnly "extra-mods:$artifactId:$version"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 17
	options.compilerArgs << "-Xlint:-deprecation" // 忽略弃用警告
	options.compilerArgs << "-Xlint:-removal" //
}

java {
	withSourcesJar()
}


jar {
	manifest {
		attributes([
				"Specification-Title"     : project.mod_id,
				"Specification-Vendor"    : project.mod_author,
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : version,
				"Implementation-Vendor"   : project.mod_author,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

def relType = "release"
if (ENV.TAG != null) {
	if (ENV.TAG.contains("alpha")) {
		relType = "alpha"
	} else if (ENV.TAG.contains("beta")) {
		relType = "beta"
	}
}
if (ENV.CURSEFORGE_KEY) {
	curseforge {
		apiKey = ENV.CURSEFORGE_KEY
		project {
			id = project.curseforge_id
			releaseType = relType
			addGameVersion "Forge"
			addGameVersion project.minecraft_version
			mainArtifact(remapJar.archiveFile)
			relations {
				requiredDependency 'projecte'
				optionalDependency 'jei'
			}
			changelog = ENV.CHANGELOG  // expected to exist if ENV.CURSEFORGE does
			changelogType = 'markdown'
		}
	}
}

def ftbURL = "https://maven.ftb.dev/release"
def sapsURL = "https://maven.saps.dev/minecraft"
def mavenVersion = project.version
if (ENV.SNAPSHOT != null && ENV.SNAPSHOT == "true") {
	ftbURL = "https://maven.ftb.dev/snapshot"
	mavenVersion += "-SNAPSHOT"
}
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = project.group
            artifactId = project.archivesBaseName
            version = mavenVersion

			artifact(remapJar) {
				builtBy remapJar
			}
		}
	}

	repositories {
		if (ENV.FTB_MAVEN_TOKEN) {
			maven {
				url ftbURL
				credentials {
					username = "ftb"
					password = "${ENV.FTB_MAVEN_TOKEN}"
				}
			}
		}

		if (ENV.SAPS_TOKEN) {
			maven {
				url sapsURL
				credentials {
					username = "ftb"
					password = "${ENV.SAPS_TOKEN}"
				}
			}
		}
	}
}
